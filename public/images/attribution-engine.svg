<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Multi-channel attribution engine: last-click misallocates 3.39 million dollars of a 10 million dollar budget">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="55%" stop-color="#0A1020"/>
      <stop offset="100%" stop-color="#0D1526"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.72">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>
  <rect width="1200" height="560" fill="url(#glow)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <!-- eyebrow -->
    <rect x="72" y="64" width="46" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="72" y="100" fill="#7DD3FC" font-size="15" font-weight="600" letter-spacing="2.4">MARKOV CHAIN  ×  SHAPLEY VALUE</text>

    <!-- title -->
    <text x="72" y="158" fill="#FFFFFF" font-size="48" font-weight="700" letter-spacing="-1.2">Multi-Channel</text>
    <text x="72" y="212" fill="#FFFFFF" font-size="48" font-weight="700" letter-spacing="-1.2">Attribution Engine</text>

    <text x="72" y="252" fill="#94A3B8" font-size="17">Replacing last-click attribution on a $10M media budget.</text>

    <!-- headline stat -->
    <text x="72" y="352" fill="#F87171" font-size="76" font-weight="700" letter-spacing="-2.6">$3.39M</text>
    <text x="72" y="386" fill="#CBD5E1" font-size="17" font-weight="500">misallocated by last-click attribution</text>
    <text x="72" y="412" fill="#64748B" font-size="15">Correcting it: +$1.73M revenue, +12.96% conversions</text>

    <!-- stat chips -->
    <g>
      <rect x="72" y="452" width="150" height="46" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <text x="88" y="474" fill="#FFFFFF" font-size="19" font-weight="650">50,000</text>
      <text x="88" y="490" fill="#64748B" font-size="12">journeys</text>

      <rect x="234" y="452" width="150" height="46" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <text x="250" y="474" fill="#FFFFFF" font-size="19" font-weight="650">7 models</text>
      <text x="250" y="490" fill="#64748B" font-size="12">bake-off</text>

      <rect x="396" y="452" width="150" height="46" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <text x="412" y="474" fill="#FFFFFF" font-size="19" font-weight="650">34 tests</text>
      <text x="412" y="490" fill="#64748B" font-size="12">axioms verified</text>
    </g>

    <!-- chart panel -->
    <rect x="646" y="96" width="482" height="368" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="676" y="132" fill="#E2E8F0" font-size="15" font-weight="600">Last-click credit vs. reality</text>
    <text x="676" y="153" fill="#64748B" font-size="12.5">distortion per channel</text>

    <!-- centre axis -->
    <line x1="940" y1="176" x2="940" y2="440" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>
    <text x="930" y="172" fill="#38BDF8" font-size="11" text-anchor="end">starved</text>
    <text x="950" y="172" fill="#F87171" font-size="11">overvalued</text>

    <!-- rows: Paid Search +90.9 -->
    <text x="676" y="205" fill="#CBD5E1" font-size="13.5">Paid Search</text>
    <rect x="940" y="192" width="130" height="20" rx="4" fill="#F87171"/>
    <text x="1078" y="206" fill="#F87171" font-size="13" font-weight="650">+91%</text>

    <!-- Email +82.1 -->
    <text x="676" y="255" fill="#CBD5E1" font-size="13.5">Email</text>
    <rect x="940" y="242" width="117" height="20" rx="4" fill="#F87171"/>
    <text x="1065" y="256" fill="#F87171" font-size="13" font-weight="650">+82%</text>

    <!-- Social Media -54.5 -->
    <text x="676" y="305" fill="#CBD5E1" font-size="13.5">Social Media</text>
    <rect x="862" y="292" width="78" height="20" rx="4" fill="#38BDF8"/>
    <text x="854" y="306" fill="#38BDF8" font-size="13" font-weight="650" text-anchor="end">−55%</text>

    <!-- Display Ads -55.0 -->
    <text x="676" y="355" fill="#CBD5E1" font-size="13.5">Display Ads</text>
    <rect x="861" y="342" width="79" height="20" rx="4" fill="#38BDF8"/>
    <text x="853" y="356" fill="#38BDF8" font-size="13" font-weight="650" text-anchor="end">−55%</text>

    <!-- Organic Search -58.5 -->
    <text x="676" y="405" fill="#CBD5E1" font-size="13.5">Organic Search</text>
    <rect x="856" y="392" width="84" height="20" rx="4" fill="#38BDF8"/>
    <text x="848" y="406" fill="#38BDF8" font-size="13" font-weight="650" text-anchor="end">−59%</text>

    <text x="676" y="440" fill="#64748B" font-size="12">The channels that create demand are not the ones that close it.</text>

    <!-- footer tech -->
    <text x="646" y="500" fill="#475569" font-size="13" letter-spacing="0.6">Python · pandas · NumPy · absorbing Markov chains · cooperative game theory</text>
  </g>
</svg>
